<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" role="img" aria-label="Bistupur 50 kWp Hospital & Healthcare Campus Solar Plant">
  <defs>
    <linearGradient id="bgHosp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgHosp)"/>
  <circle cx="500" cy="90" r="80" fill="#10B981" fill-opacity="0.15"/>
  <circle cx="500" cy="90" r="30" fill="#F59E0B"/>

  <!-- Hospital Building -->
  <rect x="80" y="160" width="440" height="200" rx="4" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  
  <!-- Hospital Red Cross Badge -->
  <rect x="270" y="180" width="60" height="60" rx="30" fill="#FFFFFF"/>
  <rect x="292" y="192" width="16" height="36" fill="#EF4444"/>
  <rect x="282" y="202" width="36" height="16" fill="#EF4444"/>

  <!-- Rooftop Solar Arrays with Elevated Struts -->
  <polygon points="60,160 540,160 510,110 90,110" fill="#0369A1" stroke="#38BDF8" stroke-width="2"/>
  <line x1="150" y1="110" x2="135" y2="160" stroke="#38BDF8" stroke-width="2"/>
  <line x1="240" y1="110" x2="225" y2="160" stroke="#38BDF8" stroke-width="2"/>
  <line x1="360" y1="110" x2="375" y2="160" stroke="#38BDF8" stroke-width="2"/>
  <line x1="450" y1="110" x2="465" y2="160" stroke="#38BDF8" stroke-width="2"/>

  <!-- Overlay Badges -->
  <rect x="30" y="30" width="160" height="34" rx="8" fill="#10B981"/>
  <text x="45" y="52" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">50 kWp DG-Sync</text>

  <rect x="30" y="330" width="220" height="40" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#334155"/>
  <text x="45" y="355" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Bistupur, Jamshedpur</text>
</svg>
