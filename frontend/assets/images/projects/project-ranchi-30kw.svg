<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" role="img" aria-label="Ranchi 30 kWp Commercial Retail Complex Solar Plant">
  <defs>
    <linearGradient id="bgRan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgRan)"/>
  <circle cx="500" cy="80" r="30" fill="#F59E0B"/>
  
  <!-- Commercial Complex Building -->
  <rect x="100" y="180" width="400" height="170" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <rect x="80" y="140" width="440" height="40" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>

  <!-- Badges -->
  <rect x="30" y="30" width="160" height="34" rx="8" fill="#F59E0B"/>
  <text x="45" y="52" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">30 kWp Retail Mall</text>

  <rect x="30" y="330" width="220" height="40" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#334155"/>
  <text x="45" y="355" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Main Road, Ranchi</text>
</svg>
