<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Translucent frosted polymer gradient (optical cross-linked EVA) -->
    <linearGradient id="evaPolymer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#F1F5F9" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#E2E8F0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6" />
    </linearGradient>

    <!-- Hermetic thermal seal perimeter edge -->
    <linearGradient id="evaThermalEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.85" />
    </linearGradient>

    <!-- Microscopic polymer cross-linking matrix pattern -->
    <pattern id="evaCrosslinkPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 20 5 L 20 15 L 10 20 L 0 15 L 0 5 Z" fill="none" stroke="#94A3B8" stroke-width="0.4" stroke-opacity="0.25" />
      <circle cx="10" cy="10" r="1.2" fill="#64748B" fill-opacity="0.2" />
    </pattern>

    <!-- Soft specular diagonal sheen across the lamination layer -->
    <linearGradient id="evaSheenSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Base encapsulant sheet -->
  <rect x="20" y="20" width="560" height="360" rx="6" fill="url(#evaPolymer)" stroke="url(#evaThermalEdge)" stroke-width="1.5" />

  <!-- Microscopic cross-linked molecular grid -->
  <rect x="20" y="20" width="560" height="360" rx="6" fill="url(#evaCrosslinkPattern)" />

  <!-- Specular diagonal reflection sweep -->
  <path d="M 80 20 L 220 20 L 360 380 L 220 380 Z" fill="url(#evaSheenSweep)" />

  <!-- Vacuum lamination boundary margin -->
  <rect x="25" y="25" width="550" height="350" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="6, 3" opacity="0.6" />

  <!-- Hermetic edge weld ticks -->
  <path d="M 32 20 L 32 25 M 568 20 L 568 25 M 32 375 L 32 380 M 568 375 L 568 380" stroke="#94A3B8" stroke-width="1" />

  <!-- Engineering spec stamp -->
  <g transform="translate(446, 362)" opacity="0.7">
    <text x="0" y="8" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="5" font-weight="600" fill="#475569" letter-spacing="0.5">EVA/POE • HERMETIC SEAL</text>
  </g>
</svg>
