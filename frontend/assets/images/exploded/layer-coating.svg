<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Optical thin-film spectral dispersion gradient -->
    <linearGradient id="arThinFilm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="28%" stop-color="#818CF8" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#C084FC" stop-opacity="0.22" />
      <stop offset="78%" stop-color="#38BDF8" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.32" />
    </linearGradient>

    <!-- Refractive interference border -->
    <linearGradient id="arBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Microscopic optical interference wave pattern (110nm visual representation) -->
    <pattern id="nanowavePattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 0 16 Q 8 8 16 16 T 32 16" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.25" />
      <path d="M 0 24 Q 8 16 16 24 T 32 24" fill="none" stroke="#818CF8" stroke-width="0.4" stroke-opacity="0.2" />
    </pattern>

    <!-- Prismatic specular bands -->
    <linearGradient id="arPrismSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="48%" stop-color="#818CF8" stop-opacity="0.22" />
      <stop offset="62%" stop-color="#C084FC" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Film substrate -->
  <rect x="20" y="20" width="560" height="360" rx="6" fill="url(#arThinFilm)" stroke="url(#arBorder)" stroke-width="1.2" />

  <!-- Nanoscale wave texture -->
  <rect x="20" y="20" width="560" height="360" rx="6" fill="url(#nanowavePattern)" />

  <!-- Prismatic optical light transmission caustics -->
  <path d="M 40 20 L 180 20 L 340 380 L 200 380 Z" fill="url(#arPrismSweep)" />
  <path d="M 280 20 L 380 20 L 520 380 L 420 380 Z" fill="url(#arPrismSweep)" opacity="0.8" />

  <!-- Optical boundary alignment markers -->
  <circle cx="28" cy="28" r="3" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.7" />
  <circle cx="572" cy="28" r="3" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.7" />
  <circle cx="28" cy="372" r="3" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.7" />
  <circle cx="572" cy="372" r="3" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.7" />

  <!-- Microscopic layer spec badge -->
  <g transform="translate(442, 362)" opacity="0.65">
    <text x="0" y="8" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="5" font-weight="600" fill="#BAE6FD" letter-spacing="0.5">SiNx COATING • λ 110nm</text>
  </g>
</svg>
