<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Satin brushed anodized aluminum profile gradient -->
    <linearGradient id="anodizedAluminumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="15%" stop-color="#E2E8F0" />
      <stop offset="45%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Deep extrusion channel shadow gradient -->
    <linearGradient id="channelShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Metallic edge highlight stroke -->
    <linearGradient id="satinEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Outer frame perimeter with 35mm structural depth -->
  <path d="M 20 20 L 580 20 L 580 380 L 20 380 Z M 48 48 L 48 352 L 552 352 L 552 48 Z" fill="url(#anodizedAluminumGrad)" stroke="#475569" stroke-width="1.5" fill-rule="evenodd" />

  <!-- Outer beveled specular chamfers -->
  <line x1="20" y1="20" x2="580" y2="20" stroke="#FFFFFF" stroke-width="2" />
  <line x1="20" y1="20" x2="20" y2="380" stroke="#FFFFFF" stroke-width="2" />
  <line x1="20" y1="380" x2="580" y2="380" stroke="#334155" stroke-width="2" />
  <line x1="580" y1="20" x2="580" y2="380" stroke="#334155" stroke-width="2" />

  <!-- Internal silicone sealing gasket bed channel -->
  <rect x="44" y="44" width="512" height="312" rx="2" fill="none" stroke="url(#channelShadow)" stroke-width="1.5" />
  <rect x="48" y="48" width="504" height="304" rx="2" fill="none" stroke="#94A3B8" stroke-width="0.8" />

  <!-- Precision 45-degree corner miter extrusion seams -->
  <line x1="20" y1="20" x2="48" y2="48" stroke="#475569" stroke-width="1.5" />
  <line x1="580" y1="20" x2="552" y2="48" stroke="#475569" stroke-width="1.5" />
  <line x1="20" y1="380" x2="48" y2="352" stroke="#475569" stroke-width="1.5" />
  <line x1="580" y1="380" x2="552" y2="352" stroke="#475569" stroke-width="1.5" />

  <!-- Precision corner internal bracket rivet details -->
  <circle cx="34" cy="34" r="2.5" fill="#64748B" stroke="#334155" stroke-width="0.75" />
  <circle cx="566" cy="34" r="2.5" fill="#64748B" stroke="#334155" stroke-width="0.75" />
  <circle cx="34" cy="366" r="2.5" fill="#64748B" stroke="#334155" stroke-width="0.75" />
  <circle cx="566" cy="366" r="2.5" fill="#64748B" stroke="#334155" stroke-width="0.75" />

  <!-- Drainage weep slots (engineered water runoff perforations) -->
  <rect x="180" y="24" width="28" height="4" rx="2" fill="#1E293B" stroke="#64748B" stroke-width="0.5" />
  <rect x="390" y="24" width="28" height="4" rx="2" fill="#1E293B" stroke="#64748B" stroke-width="0.5" />
  <rect x="180" y="372" width="28" height="4" rx="2" fill="#1E293B" stroke="#64748B" stroke-width="0.5" />
  <rect x="390" y="372" width="28" height="4" rx="2" fill="#1E293B" stroke="#64748B" stroke-width="0.5" />

  <!-- Structural racking mounting slots (profile holes) -->
  <rect x="25" y="150" width="4" height="24" rx="2" fill="#1E293B" />
  <rect x="25" y="226" width="4" height="24" rx="2" fill="#1E293B" />
  <rect x="571" y="150" width="4" height="24" rx="2" fill="#1E293B" />
  <rect x="571" y="226" width="4" height="24" rx="2" fill="#1E293B" />

  <!-- Electrical protective ground symbol stamp (authentic electrical engineering standard) -->
  <g transform="translate(60, 362)" opacity="0.8">
    <circle cx="7" cy="7" r="6" fill="none" stroke="#475569" stroke-width="0.75" />
    <line x1="7" y1="3" x2="7" y2="7" stroke="#475569" stroke-width="0.8" />
    <line x1="4" y1="7" x2="10" y2="7" stroke="#475569" stroke-width="0.8" />
    <line x1="5" y1="9" x2="9" y2="9" stroke="#475569" stroke-width="0.8" />
    <line x1="6" y1="11" x2="8" y2="11" stroke="#475569" stroke-width="0.8" />
    <text x="17" y="9" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="5" font-weight="600" fill="#475569" letter-spacing="0.5">GROUND ⏚</text>
  </g>

  <!-- Mechanical engineering rating stamp -->
  <g transform="translate(425, 362)" opacity="0.8">
    <text x="0" y="8" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="5" font-weight="600" fill="#475569" letter-spacing="0.5">AL6063-T6 • 5400Pa/2400Pa</text>
  </g>
</svg>
