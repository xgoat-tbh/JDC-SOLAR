<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crystalline silicon wafer gradient (deep twilight navy) -->
    <linearGradient id="waferSiliconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="35%" stop-color="#0F2347" />
      <stop offset="70%" stop-color="#142C56" />
      <stop offset="100%" stop-color="#081120" />
    </linearGradient>

    <!-- Silver busbar metallic ribbon gradient -->
    <linearGradient id="silverBusbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="30%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Microscopic silver finger grid pattern -->
    <pattern id="microFingers" width="86" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1.5" x2="86" y2="1.5" stroke="#38BDF8" stroke-width="0.3" stroke-opacity="0.32" />
    </pattern>

    <!-- Single M10 Half-Cut Monocrystalline Cell Wafer Definition -->
    <g id="m10Cell">
      <!-- Chamfered pseudo-square silicon wafer -->
      <polygon points="5,0 81,0 86,5 86,74 81,79 5,79 0,74 0,5" fill="url(#waferSiliconGrad)" stroke="#1E293B" stroke-width="0.75" />
      <!-- Ultra-dense silver finger grid -->
      <polygon points="5,0 81,0 86,5 86,74 81,79 5,79 0,74 0,5" fill="url(#microFingers)" />
      <!-- Multi-Busbar (MBB) round wires traversing the cell -->
      <line x1="9" y1="0" x2="9" y2="79" stroke="url(#silverBusbarGrad)" stroke-width="0.9" />
      <line x1="17" y1="0" x2="17" y2="79" stroke="url(#silverBusbarGrad)" stroke-width="0.9" />
      <line x1="26" y1="0" x2="26" y2="79" stroke="url(#silverBusbarGrad)" stroke-width="0.9" />
      <line x1="34" y1="0" x2="34" y2="79" stroke="url(#silverBusbarGrad)" stroke-width="0.9" />
      <line x1="43" y1="0" x2="43" y2="79" stroke="url(#silverBusbarGrad)" stroke-width="0.9" />
      <line x1="52" y1="0" x2="52" y2="79" stroke="url(#silverBusbarGrad)" stroke-width="0.9" />
      <line x1="60" y1="0" x2="60" y2="79" stroke="url(#silverBusbarGrad)" stroke-width="0.9" />
      <line x1="69" y1="0" x2="69" y2="79" stroke="url(#silverBusbarGrad)" stroke-width="0.9" />
      <line x1="77" y1="0" x2="77" y2="79" stroke="url(#silverBusbarGrad)" stroke-width="0.9" />
    </g>
  </defs>

  <!-- High-reflectivity white dielectric backsheet / substrate -->
  <rect x="20" y="20" width="560" height="360" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" />

  <!-- Master Top Bus Ribbon Conductors -->
  <rect x="26" y="23" width="548" height="3" fill="url(#silverBusbarGrad)" opacity="0.85" />

  <!-- 6-Column x 4-Row Matrix of M10 Half-Cut Cells (24-Cell High-Yield String) -->
  <!-- Row 1 -->
  <use href="#m10Cell" x="28" y="28" />
  <use href="#m10Cell" x="118" y="28" />
  <use href="#m10Cell" x="208" y="28" />
  <use href="#m10Cell" x="298" y="28" />
  <use href="#m10Cell" x="388" y="28" />
  <use href="#m10Cell" x="478" y="28" />

  <!-- Row 2 -->
  <use href="#m10Cell" x="28" y="111" />
  <use href="#m10Cell" x="118" y="111" />
  <use href="#m10Cell" x="208" y="111" />
  <use href="#m10Cell" x="298" y="111" />
  <use href="#m10Cell" x="388" y="111" />
  <use href="#m10Cell" x="478" y="111" />

  <!-- Inter-string midpoint gap with bypass ribbon lines -->
  <line x1="28" y1="192.5" x2="564" y2="192.5" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="8, 4" />

  <!-- Row 3 -->
  <use href="#m10Cell" x="28" y="196" />
  <use href="#m10Cell" x="118" y="196" />
  <use href="#m10Cell" x="208" y="196" />
  <use href="#m10Cell" x="298" y="196" />
  <use href="#m10Cell" x="388" y="196" />
  <use href="#m10Cell" x="478" y="196" />

  <!-- Row 4 -->
  <use href="#m10Cell" x="28" y="279" />
  <use href="#m10Cell" x="118" y="279" />
  <use href="#m10Cell" x="208" y="279" />
  <use href="#m10Cell" x="298" y="279" />
  <use href="#m10Cell" x="388" y="279" />
  <use href="#m10Cell" x="478" y="279" />

  <!-- Master Bottom Bus Ribbon Conductors -->
  <rect x="26" y="362" width="548" height="3" fill="url(#silverBusbarGrad)" opacity="0.85" />

  <!-- Inter-cell connection ribbons bridging rows -->
  <g stroke="url(#silverBusbarGrad)" stroke-width="1.2" opacity="0.75">
    <line x1="71" y1="107" x2="71" y2="111" />
    <line x1="161" y1="107" x2="161" y2="111" />
    <line x1="251" y1="107" x2="251" y2="111" />
    <line x1="341" y1="107" x2="341" y2="111" />
    <line x1="431" y1="107" x2="431" y2="111" />
    <line x1="521" y1="107" x2="521" y2="111" />

    <line x1="71" y1="275" x2="71" y2="279" />
    <line x1="161" y1="275" x2="161" y2="279" />
    <line x1="251" y1="275" x2="251" y2="279" />
    <line x1="341" y1="275" x2="341" y2="279" />
    <line x1="431" y1="275" x2="431" y2="279" />
    <line x1="521" y1="275" x2="521" y2="279" />
  </g>

  <!-- Laser-etched string code marking -->
  <g transform="translate(450, 368)" opacity="0.7">
    <text x="0" y="8" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="5" font-weight="600" fill="#475569" letter-spacing="0.5">M10 HALF-CUT • 16BB • ALMM</text>
  </g>
</svg>
