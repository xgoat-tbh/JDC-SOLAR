<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" width="220" height="70">
  <defs>
    <linearGradient id="adaniGradLarge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0060A9"/>
      <stop offset="48%" stop-color="#4B2C82"/>
      <stop offset="100%" stop-color="#9C2785"/>
    </linearGradient>
  </defs>
  
  <g transform="translate(110, 36)">
    <!-- "adani" large logotype -->
    <text x="0" y="4" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#adaniGradLarge)" text-anchor="middle" letter-spacing="-0.5">adani</text>
  </g>
  
  <!-- Horizontal underline bar -->
  <line x1="30" y1="48" x2="190" y2="48" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- "Solar" -->
  <text x="110" y="65" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="1">Solar</text>
</svg>
