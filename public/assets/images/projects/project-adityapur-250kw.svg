<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" role="img" aria-label="Adityapur 250 kWp Industrial Rooftop Solar Power Plant">
  <defs>
    <linearGradient id="bgInd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="solarBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgInd)"/>
  
  
  <circle cx="480" cy="80" r="100" fill="#F59E0B" fill-opacity="0.15"/>
  <circle cx="480" cy="80" r="35" fill="#F59E0B" fill-opacity="0.8"/>

  
  <polygon points="50,280 200,180 550,180 400,280" fill="#334155"/>
  <polygon points="50,280 50,350 400,350 400,280" fill="#1E293B" stroke="#475569"/>
  <polygon points="400,280 400,350 550,250 550,180" fill="#0F172A" stroke="#475569"/>

  
  <g fill="url(#solarBlue)" stroke="#38BDF8" stroke-width="1.5">
    <polygon points="90,260 190,195 240,195 140,260"/>
    <polygon points="160,260 260,195 310,195 210,260"/>
    <polygon points="230,260 330,195 380,195 280,260"/>
    <polygon points="300,260 400,195 450,195 350,260"/>
    <polygon points="370,260 470,195 520,195 420,260"/>
  </g>

  
  <path d="M500 350 L530 200 L560 350 Z" fill="none" stroke="#64748B" stroke-width="2"/>
  <line x1="510" y1="260" x2="550" y2="260" stroke="#64748B" stroke-width="2"/>
  <line x1="518" y1="220" x2="542" y2="220" stroke="#64748B" stroke-width="2"/>

  
  <rect x="30" y="30" width="130" height="34" rx="8" fill="#F59E0B"/>
  <text x="45" y="52" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">250 kWp HT</text>

  <rect x="30" y="330" width="220" height="40" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#334155"/>
  <text x="45" y="355" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Adityapur Industrial Area</text>
</svg>
